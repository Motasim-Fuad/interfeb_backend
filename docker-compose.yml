services:
  db:
    # postgres:16 + the pgvector extension (FabriQ assistant vector store); same data format as postgres:16.
    image: pgvector/pgvector:pg16-trixie
    container_name: interfab-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: interfab
      POSTGRES_PASSWORD: interfab
      POSTGRES_DB: interfab
    ports:
      - "5433:5432"
    volumes:
      - interfab_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interfab"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: interfab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: interfab-api
    restart: unless-stopped
    # Safe local defaults always exist; an optional .env overrides them when present.
    # This lets `docker compose up --build` work on a fresh unzip without a setup error.
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - interfab_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  interfab_pg_data:
  interfab_media:
